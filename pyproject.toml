[project]
name = "investment-research"
version = "0.1.0"
description = "Evidence-first financial research system for Vietnamese listed companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "filetype>=1.2",
    "httpx>=0.28",
    "minio>=7.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pymupdf>=1.28.2",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-redis>=4.6",
]
ocr = [
    "paddleocr==2.9.1",
    "paddlepaddle>=2.6.2,<3.0.0",
    "setuptools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "apps", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src", "apps"]
exclude = ["tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: tests requiring Docker services",
]

[dependency-groups]
dev = [
    "types-openpyxl>=3.1.5.20260807",
]
